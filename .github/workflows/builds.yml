name: Build Gerald (.3dsx)

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write        # lets tagged builds attach the file to a GitHub release

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest

    steps:
      - uses: actions/checkout@v4

      - name: Install system packages
        run: |
          apt-get update
          apt-get install -y --no-install-recommends make build-essential

      - name: Install 3DS libraries (libctru, citro2d, citro3d, tex3ds, smdhtool, 3dsxtool)
        run: dkp-pacman -Sy --noconfirm --needed 3ds-dev

      - name: Test the pet simulation (runs on the build machine)
        run: |
          cc -Wall -Wextra -O1 -Isource tools/test_gerald.c source/gerald.c -o /tmp/test_gerald
          /tmp/test_gerald

      - name: Build gerald.3dsx
        run: make -j"$(nproc)" 3dsx

      - name: Show result
        run: ls -l gerald.3dsx

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: gerald-3dsx
          path: gerald.3dsx
          if-no-files-found: error

      - name: Attach to release (tags like v1.0)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: gerald.3dsx
