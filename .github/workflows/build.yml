name: Build Gerald (.cia + .3dsx)

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write        # lets tagged builds attach the files to a GitHub release

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v4

      - name: Install system packages
        run: |
          apt-get update
          apt-get install -y --no-install-recommends curl ca-certificates unzip jq make git build-essential

      - name: Install 3DS libraries (libctru, citro2d, citro3d, tex3ds, smdhtool, 3dsxtool)
        run: dkp-pacman -Sy --noconfirm --needed 3ds-dev

      - name: Cache makerom + bannertool
        id: tools-cache
        uses: actions/cache@v4
        with:
          path: bin
          key: cia-tools-v1

      - name: Get makerom + bannertool
        if: steps.tools-cache.outputs.cache-hit != 'true'
        run: ./tools/get_cia_tools.sh

      - name: Test the pet simulation (runs on the build machine)
        run: |
          cc -Wall -Wextra -O1 -Isource tools/test_gerald.c source/gerald.c -o /tmp/test_gerald
          /tmp/test_gerald

      - name: Build .3dsx and .cia
        run: make -j"$(nproc)" all

      - name: Show results
        run: ls -l gerald.3dsx gerald.cia

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gerald-3ds
          path: |
            gerald.cia
            gerald.3dsx
          if-no-files-found: error

      - name: Attach to release (tags like v1.0)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            gerald.cia
            gerald.3dsx
